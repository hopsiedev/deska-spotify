<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section id="player" hidden>
    <section class="np">
      <img id="cover" alt="" hidden>
      <div id="coverPh" class="ph">♪</div>
      <div class="meta">
        <div id="title" class="title">Spotify</div>
        <div id="artist" class="artist">—</div>
      </div>
      <button id="setup" class="gear" title="Conectar otro PC" aria-label="Conectar otro PC">⋯</button>
    </section>
    <div class="tl">
      <span id="tPos">0:00</span>
      <input id="seek" type="range" min="0" max="1" step="0.1" value="0" title="Posición">
      <span id="tLeft">-0:00</span>
    </div>
    <div class="ctl">
      <button id="prev" class="ic" title="Anterior" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="toggle" class="ic main" title="Reproducir / pausar" aria-label="Reproducir / pausar">
        <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="next" class="ic" title="Siguiente" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <svg class="vi" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8z"/></svg>
      <input id="vol" type="range" min="0" max="100" value="100" title="Volumen">
    </div>
  </section>

  <section id="pair" class="card" hidden>
    <h1 id="pairTitle">Conecta tu PC</h1>
    <p id="pairText">Pega este comando en una terminal de tu PC. Instala un programa pequeño que controla tu Spotify de escritorio.</p>
    <div class="tabs">
      <button id="tabWin" type="button">Windows</button>
      <button id="tabMac" type="button">macOS</button>
    </div>
    <pre id="cmdBox"></pre>
    <div class="row">
      <button id="copy" type="button">Copiar comando</button>
      <button id="newCode" type="button" class="ghost" title="Genera otro código; el PC conectado dejará de funcionar">Nuevo código</button>
      <button id="closePair" type="button" class="ghost" hidden>Cerrar</button>
    </div>
    <div id="waiting" class="wait">Esperando a tu PC…</div>
  </section>

  <div id="msg" class="msg"></div>
  <div id="ver" class="ver"></div>
  <script src="/__deska/sdk.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
